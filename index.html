<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>betting exchange</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
        >
        <link rel="stylesheet" href="/css/style.css">
    </head>
    <body>
        <div class="crop-container">
            <img src="/images/logo.png" alt="logo">
        </div>
        <div class="row-div", style="padding-inline: 20px;">
            <div class="chart-container">
                <canvas id="liveChart"></canvas>
            </div>
            <div class="column-div", style="justify-content: center; gap: 20px;">
                <div>
                    <input style="accent-color: rgba(0, 255, 0, 0.7);" type="checkbox" name="is_back" id="">
                    <label for="is_back">back bet</label>
                </div>
                <input type="number" name="" id="">
                <button style="background-color: rgba(0, 255, 0, 0.7);">bet</button>
            </div>
        </div>
        <p>matched bets so far: <span id="num-matched">0</span></p>
        <p>fair odds: <span id="fair-odds">0</span></p>
        
<!--         <div class="queue-div">
            <p>open bets (max 5 each): </p>
            <div id="open-bets-list"></div>
        </div> -->
        <script src="/js/main.js"></script>
    </body>
</html>
