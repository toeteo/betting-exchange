<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>betting exchange</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
        >
        <style>
            .queue-div {
                display: flex;
                flex-direction: column;
            }
            .chart-container {
                width: 600px;
                max-width: 90%;
                margin: 40px auto;
            }
            .crop-container {
                width: 200px;       /* Set your target width */
                height: 100px;      /* Set your target height */
                overflow: hidden;   /* Cut off anything that overflows the box */
            }

            .crop-container img {
                width: 100%;
                height: 100%;
                object-fit: cover;     /* Fits and crops the image without stretching */
                object-position: center; /* Focuses on the center (can use top, bottom, etc.) */
            }

            p {
                color: white;
            }
        </style>
    </head>
    <body>
        <div class="crop-container">
            <img src="/images/logo.png" alt="logo">
        </div>
        <p>matched bets so far: <span id="num-matched">0</span></p>
        <p>fair odds: <span id="fair-odds">0</span></p>
        <div class="chart-container">
            <canvas id="liveChart"></canvas>
        </div>
        <div class="queue-div">
            <p>open bets (max 5 each): </p>
            <div id="open-bets-list"></div>
        </div>
        <script>
            let fairOdds = 0;
            const ctx = document.getElementById('liveChart');

            // 1. Initialize once
            // Replace with your data (odds ascending, one entry per tick)
            
            const fairLine = {
                id: 'fairLine',
                afterDatasetsDraw(chart) {
                    const n = chart.data.labels.length;
                    if (n < 3) return;
                    const idx = (n - 1) / 2;

                    const { ctx, chartArea: { top, bottom }, scales: { x } } = chart;
                    const px = x.getPixelForValue(idx);

                    ctx.save();
                    ctx.setLineDash([6, 4]);
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(px, top);
                    ctx.lineTo(px, bottom);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.fillStyle = 'white';
                    ctx.restore();
                }
            }
            
            Chart.defaults.color = 'white';

            const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                {
                    label: 'unmatched',
                    data: [],
                    stepped: 'middle',
                    fill: 'origin',
                    borderColor: 'rgba(0, 0, 128, 0)',
                    backgroundColor: 'rgba(0, 128, 128, 0.3)',
                    borderWidth: 1.5,
                    pointRadius: 0,
                    color: 'white'
                },
                {
                    label: 'matched',
                    data: [],
                    stepped: 'middle',
                    fill: 'origin',
                    borderColor: 'rgba(255, 159, 64, 0)',
                    backgroundColor: 'rgba(128, 128, 0, 0.3)',
                    borderWidth: 1.5,
                    pointRadius: 0,
                    color: 'white'
                },
                ],
            },
            options: {
                color: 'white',
                responsive: true,
                layout: { padding: { top: 20 } },
                interaction: { mode: 'index', intersect: false },
                animation: {
                    duration: 100
                },
                scales: {
                x: { title: { display: true, text: 'Odds', color: 'white' } ,
                    grid: {color: 'rgba(255, 255, 255, 0.1)' },
                    border: {display: false },
                    display: true,
                },
                y: {
                    min: -1,
                    max: 1,
                    title: { display: true, text: 'Liquidity (▲ unmatched / ▼ matched)', color: 'white' },
                    ticks: { callback: v => Math.abs(v).toLocaleString(), color: 'white' },
                    grid: {color: 'rgba(255, 255, 255, 0.1)' },
                    border: { display: false },
                },
                },
                plugins: {
                    tooltip: {
                        callbacks: {
                        label: c => `${c.dataset.label}: ${Math.abs(c.parsed.y).toLocaleString()}`,
                        color: 'white'
                        },
                        color: 'white',
                    },
                },
            },
            plugins: [fairLine]
            });

            const wsUrl = `ws://${window.location.host}/ws`;
            const ws = new WebSocket(wsUrl);

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                // render num matched
                document.getElementById("num-matched").textContent = data.num_matched;

                // render open bets
                const openBetsList = document.getElementById("open-bets-list");
                openBetsList.replaceChildren(); // clear previous elements

                const complete_queue = data.back_queue.concat(data.lay_queue);

                complete_queue.forEach(([id, is_back, odds, amount]) => {
                    const p = document.createElement("p");
                    p.textContent = `#${id} | x${odds.toFixed(2)} | $${amount.toFixed(2)}`;
                    p.style.color = is_back ? "blue" : "green";
                    openBetsList.appendChild(p);
                });
                
                // render fair odds
                fairOdds = data.fair_odds;
                document.getElementById("fair-odds").textContent = data.fair_odds;
                
                // update chart
                chart.data.datasets[0].data = data.liq_um;
                chart.data.datasets[1].data = data.liq_ma.map((v) => -v);
                chart.data.labels = data.odds;
                chart.update();
            };

            ws.onopen = () => console.log("Connected to stream");
            ws.onclose = () => console.log("Disconnected");
        </script>
    </body>
</html>
